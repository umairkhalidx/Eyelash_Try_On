<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eyelash Try-On & Recommendation System</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/opencv.js@4.8.0/opencv.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .upload-section, .results-section {
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 8px;
        }
        .controls {
            margin: 15px 0;
        }
        .control-group {
            margin: 10px 0;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="range"] {
            width: 100%;
        }
        .value-display {
            display: inline-block;
            width: 50px;
            text-align: right;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background-color: #0056b3;
        }
        button:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
        }
        canvas {
            max-width: 100%;
            border: 1px solid #ddd;
        }
        .recommendation {
            border: 1px solid #e0e0e0;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .top-pick {
            background-color: #f8f9fa;
            border-left: 4px solid #007bff;
        }
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #007bff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 2s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <h1>Eyelash Virtual Try-On & Recommendation System</h1>
    
    <div class="container">
        <div class="upload-section">
            <h2>Upload Your Photo</h2>
            <input type="file" id="imageInput" accept="image/*">
            <button onclick="analyzeImage()" id="analyzeBtn">Analyze & Recommend</button>
            <button onclick="tryOnEyelashes()" id="tryOnBtn" disabled>Try On Eyelashes</button>
            
            <div class="controls">
                <h3>Adjustment Controls</h3>
                
                <div class="control-group">
                    <label for="eyelashSelect">Eyelash Style:</label>
                    <select id="eyelashSelect">
                        <option value="Drunk In Love">Drunk In Love</option>
                        <option value="Wedding Day">Wedding Day</option>
                        <option value="Foxy">Foxy</option>
                        <option value="Flare">Flare</option>
                        <option value="Vixen">Vixen</option>
                        <option value="Other Half 1">Other Half 1</option>
                        <option value="Other Half 2">Other Half 2</option>
                        <option value="Staycation">Staycation</option>
                        <option value="Iconic">Iconic</option>
                    </select>
                </div>

                <div class="control-group">
                    <label for="verticalOffset">Vertical Offset: <span id="verticalValue" class="value-display">-10</span></label>
                    <input type="range" id="verticalOffset" min="-50" max="50" value="-10" step="1">
                </div>

                <div class="control-group">
                    <label for="horizontalOffset">Horizontal Offset: <span id="horizontalValue" class="value-display">0</span></label>
                    <input type="range" id="horizontalOffset" min="-50" max="50" value="0" step="1">
                </div>

                <div class="control-group">
                    <label for="sizeScale">Size Scale: <span id="sizeValue" class="value-display">2.0</span></label>
                    <input type="range" id="sizeScale" min="0.5" max="3.0" value="2.0" step="0.1">
                </div>

                <div class="control-group">
                    <label for="heightScale">Height Scale: <span id="heightValue" class="value-display">1.0</span></label>
                    <input type="range" id="heightScale" min="0.5" max="2.0" value="1.0" step="0.1">
                </div>

                <div class="control-group">
                    <label for="rotationAngle">Rotation Angle: <span id="rotationValue" class="value-display">0</span></label>
                    <input type="range" id="rotationAngle" min="-45" max="45" value="0" step="1">
                </div>
            </div>
        </div>

        <div class="results-section">
            <h2>Results</h2>
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Processing...</p>
            </div>
            <canvas id="resultCanvas"></canvas>
            <div id="recommendations"></div>
        </div>
    </div>

    <script src="eyelash-system.js"></script>
</body>
</html>
