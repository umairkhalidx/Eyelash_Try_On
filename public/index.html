<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eyelash Try-On & Recommendation System</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/face-landmarks-detection"></script>
</head>
<body>
    <!-- Header -->
    <header class="main-header">
        <h1>Eyelash Try On and Recommendation System</h1>
    </header>

    <div class="container">
        <!-- Main Layout -->
        <div class="main-layout">
            <!-- Left Panel - Image Display -->
            <div class="left-panel">
                <div class="image-display" id="imageDisplay">
                    <!-- Initial Upload Prompt -->
                    <div class="upload-section" id="uploadSection">
                        <div class="dummy-image-container">
                            <div class="dummy-box"></div>
                            <p class="dummy-text">Upload or capture an image to begin</p>
                        </div>
                        <div class="upload-controls">
                            <button class="control-btn" id="uploadBtn">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
                                </svg>
                                Upload
                            </button>
                            <button class="control-btn" id="cameraBtn">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/>
                                    <circle cx="12" cy="13" r="4"/>
                                </svg>
                                Camera
                            </button>
                            <input type="file" id="fileInput" accept="image/*" style="display: none;">
                        </div>
                    </div>

                    <!-- Video Display -->
                    <div class="video-container" id="videoContainer" style="display: none;">
                        <video id="video" autoplay playsinline></video>
                        <div class="face-guide-box"></div>
                        <button class="capture-btn" id="captureBtn">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                                <circle cx="12" cy="12" r="10"/>
                            </svg>
                        </button>
                    </div>

                    <!-- Image Preview -->
                    <div class="image-container" id="imageContainer" style="display: none;">
                        <div class="image-preview-wrapper">
                            <img id="imagePreview" alt="Preview">
                            <canvas id="resultCanvas"></canvas>
                        </div>
                        <!-- Upload controls at bottom when image is displayed -->
                        <div class="bottom-controls" id="bottomControls" style="display: none;">
                            <div class="upload-controls">
                                <button class="control-btn" id="uploadBtnBottom">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
                                    </svg>
                                    Upload
                                </button>
                                <button class="control-btn" id="cameraBtnBottom">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/>
                                        <circle cx="12" cy="13" r="4"/>
                                    </svg>
                                    Camera
                                </button>
                                <input type="file" id="fileInputBottom" accept="image/*" style="display: none;">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Panel - Options -->
            <div class="right-panel">
                <!-- Mode Selection (Initially hidden) -->
                <div class="mode-selection" id="modeSelection" style="display: none;">
                    <h2>Choose Mode</h2>
                    <button class="mode-btn" id="tryOnModeBtn">
                        <span> Try-On Mode</span>
                        <small>Select and apply eyelashes</small>
                    </button>
                    <button class="mode-btn" id="recommendModeBtn">
                        <span> Recommendation Mode</span>
                        <small>Get personalized suggestions</small>
                    </button>
                </div>

                <!-- Mode Switcher (Shown after mode selection) -->
                <div class="mode-switcher" id="modeSwitcher" style="display: none;">
                    <h2>Current Mode: <span id="currentModeText">Try-On</span></h2>
                    <div class="switcher-buttons">
                        <button class="switcher-btn active" id="switchToTryOn">Try-On Mode</button>
                        <button class="switcher-btn" id="switchToRecommend">Recommendation Mode</button>
                    </div>
                </div>

                <!-- Adjustment Controls (shown after try-on) -->
                <div class="adjustment-controls" id="adjustmentControls" style="display: none;">
                    <h2>Adjustment Controls</h2>
                    <div class="control-row">
                        <button class="adj-btn" id="upBtn">↑</button>
                        <button class="adj-btn" id="downBtn">↓</button>
                        <button class="adj-btn" id="leftBtn">←</button>
                        <button class="adj-btn" id="rightBtn">→</button>
                        <button class="adj-btn" id="minusBtn">−</button>
                        <span class="scale-value" id="scaleValue">2.0</span>
                        <button class="adj-btn" id="plusBtn">+</button>
                        <button class="adj-btn" id="rotateLeftBtn">↶</button>
                        <button class="adj-btn" id="rotateRightBtn">↷</button>
                        <button class="adj-btn" id="resetBtn">⟲</button>
                    </div>
                </div>

                <!-- Try-On Mode Content -->
                <div class="try-on-content" id="tryOnContent" style="display: none;">
                    <h2>All Lashes Collection</h2>
                    <div class="lashes-grid" id="lashesGrid">
                        <!-- Lashes will be populated here -->
                    </div>
                </div>

                <!-- Recommendation Mode Content -->
                <div class="recommend-content" id="recommendContent" style="display: none;">
                    <h2>Get Recommendations</h2>
                    <button class="recommend-btn" id="analyzeBtn">
                         Analyze My Eyes
                    </button>
                    <div class="analysis-info" id="analysisInfo">
                            <!-- Eye analysis info will appear here -->
                    </div>
                    
                    <div class="recommendations-section" id="recommendationsSection" style="display: none;">
                        <h3>Top 3 Recommended Lashes</h3>
                        <div class="top-picks" id="topPicks">
                            <!-- Top recommendations will appear here -->
                        </div>
                        
                        <h3>All Lashes Collection</h3>
                        <div class="lashes-grid" id="allLashesGrid">
                            <!-- All lashes will appear here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <p>Processing...</p>
    </div>

    <!-- Include external JS -->
    <script src="eyelash-system.js"></script>
</body>
</html>
